<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — VehicleSure. The page you're looking for doesn't exist or has been moved.">
    <title>404 — Page Not Found | VehicleSure</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .shield-spin {
            animation: float 3s ease-in-out infinite;
            display: block;
            margin: 0 auto 0.5rem;
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .gear-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            opacity: 0.04;
            animation: spin-slow 20s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body class="fullscreen-page">

<!-- Top Bar: Logo left, toggles right -->
<div class="fullscreen-topbar">
    <!-- Logo (links to home) -->
    <a href="index.html" class="nav-logo" aria-label="VehicleSure Home">
        <img src="logo.svg" alt="VehicleSure Logo" width="38" height="38" style="width:38px;height:38px;object-fit:contain;display:block;">
        <div class="nav-logo-text">
            <span class="brand-top">VehicleSure</span>
            <span class="brand-bottom">Motor Insurance & Docs</span>
        </div>
    </a>
    <!-- Toggles -->
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:560px;width:100%;margin:0 auto;">
        <!-- Background gear decoration -->
        <svg class="gear-bg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 5 L55 15 Q60 14 65 16 L73 8 L82 17 L74 25 Q77 30 77 35 L88 38 L88 52 L77 55 Q77 60 74 65 L82 73 L73 82 L65 74 Q60 76 55 75 L52 86 L38 86 L35 75 Q30 76 25 74 L17 82 L8 73 L16 65 Q13 60 13 55 L2 52 L2 38 L13 35 Q13 30 16 25 L8 17 L17 8 L25 16 Q30 14 35 15 L50 5 Z" stroke="#1E4FD8" stroke-width="2"/>
            <circle cx="50" cy="50" r="18" stroke="#1E4FD8" stroke-width="2"/>
        </svg>

        <!-- 404 Number -->
        <div style="position:relative;display:inline-block;width:100%;text-align:center;margin-bottom:1.5rem;">
            <div class="error-code">404</div>
        </div>

        <!-- Shield icon -->
        <svg class="shield-spin" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:1.5rem;">
            <path d="M32 4 L56 14 L56 32 C56 46 45 56 32 60 C19 56 8 46 8 32 L8 14 Z" fill="rgba(30,79,216,0.1)" stroke="#1E4FD8" stroke-width="2"/>
            <path d="M22 32 L29 39 L42 26" stroke="#1E4FD8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="32" y1="20" x2="32" y2="20" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
            <path d="M27 20 L37 20 M32 15 L32 26" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
        </svg>

        <div class="error-subtitle">Page Not Found</div>
        <p class="error-desc">The road you're on leads nowhere. This page has been moved, deleted, or never existed. Let's get you back on track.</p>

        <div style="display:flex;gap:0.875rem;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn btn-primary btn-lg"><i class="fas fa-home"></i> Back to Home</a>
            <a href="contact.html" class="btn btn-secondary btn-lg">Contact Support</a>
        </div>

        <!-- Suggestions -->
        <div style="margin-top:3rem;padding:1.5rem;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-2xl);">
            <p style="font-family:var(--font-heading);font-weight:600;font-size:0.875rem;color:var(--text-heading);margin-bottom:1rem;">You might be looking for:</p>
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;">
                <a href="services.html" class="badge badge-outline" style="padding:0.5rem 1rem;font-size:0.8125rem;border-radius:var(--radius-full);cursor:pointer;transition:var(--transition-fast);">Our Services</a>
                <a href="documents.html" class="badge badge-outline" style="padding:0.5rem 1rem;font-size:0.8125rem;border-radius:var(--radius-full);cursor:pointer;transition:var(--transition-fast);">Documents Needed</a>
                <a href="fees.html" class="badge badge-outline" style="padding:0.5rem 1rem;font-size:0.8125rem;border-radius:var(--radius-full);cursor:pointer;transition:var(--transition-fast);">Fees & Pricing</a>
                <a href="contact.html" class="badge badge-outline" style="padding:0.5rem 1rem;font-size:0.8125rem;border-radius:var(--radius-full);cursor:pointer;transition:var(--transition-fast);">Book Appointment</a>
            </div>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();
    });
</script>
</body>
</html>
